services:
  control-plane:
    image: ghcr.io/utopikcode/quickspaces-control-plane:0.0.0-alpha.9
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=control-plane-db;Port=5432;Database=quickspaces;Username=postgres;Password=postgres"
    ports:
      - "5000:80"
    depends_on:
      control-plane-db:
        condition: service_healthy

  control-plane-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickspaces
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    image: ghcr.io/utopikcode/quickspaces-runner:0.0.0-alpha.3
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: devcontainer.env
    volumes:
      - ..:/workspaces/quickspaces-vscode-extension:cached
    working_dir: /workspaces/quickspaces-vscode-extension
    command: sleep infinity
    depends_on:
      - control-plane
      - runner

volumes:
  postgres_data:
